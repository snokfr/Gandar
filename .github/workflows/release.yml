name: Release

# Publishes downloadable builds when a version tag (e.g. v0.1.0) is pushed.
#
# Linux and macOS desktop builds are intentionally absent: they need their own
# media_kit_libs_* packages and a verified build before they can ship. Add them
# together with those dependencies in a follow-up.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (drift)
        run: dart run build_runner build

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build Windows release
        run: flutter build windows --release --dart-define=SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}

      - name: Package Windows build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath gandar-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: gandar-windows-x64
          path: gandar-windows-x64.zip
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (drift)
        run: dart run build_runner build

      - name: Build APK
        run: flutter build apk --release --dart-define=SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: gandar-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/gandar-windows-x64/gandar-windows-x64.zip
            artifacts/gandar-android-apk/app-release.apk
